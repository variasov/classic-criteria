[build-system]
requires = [
    "setuptools >= 40.6.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "classic-criteria"
version = "1.0.1"
authors = [
    {name = "Sergey Variasov", email = "variasov@gmail.com"},
]
description = "Criteria (specifications) for DDD domain models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/variasov/classic-criteria"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"classic.criteria" = ["py.typed"]

[dependency-groups]
dev = [
    "pyright[nodejs]~=1.1.414",
    "pytest~=9.2.0",
    "ruff~=0.17.3",
    "vulture~=2.16",
    "mutmut~=3.8; sys_platform != 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["--doctest-modules"]  # examples in docstrings are tests too

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    ".venv",
    "mutants",
]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
extraPaths = ["src"]

[tool.ruff]
extend-exclude = ["mutants"]
target-version = "py310"

[tool.ruff.format]
exclude = ["*.md"]  # ruff would reformat python snippets in README

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",     # keeps D211: no blank line before class docstring
    "D213",     # keeps D212: multi-line summary on first line
    "EM",       # error-message style is overly prescriptive
    "TRY003",   # long exception messages are an API concern
    "D205",     # docstrings use wrapped multi-line summaries (Russian text)
    "RUF002",   # docstrings are in Russian: Cyrillic letters are intended
    "RUF003",   # comments are in Russian: Cyrillic letters are intended
    "CPY001",   # no copyright headers in this project
    "COM812",   # conflicts with the ruff formatter
    "N818",     # CriteriaNotSatisfied is public API, renaming breaks users
    "PLC0105",  # TypeVar names do not encode variance (no _co/_contra)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "SLF001",   # tests inspect private helpers
    "S101",     # `assert` is idiomatic in pytest
    "D",        # tests do not need docstrings
    "ANN",      # test annotations are optional
    "PLR2004",  # magic values are acceptable in assertions
    "INP001",   # tests are not a package (no tests/__init__.py)
]

[tool.vulture]
paths = ["src", "tests"]
exclude = ["mutants"]
min_confidence = 60

[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
