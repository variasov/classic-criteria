[build-system]
requires = [
    "setuptools >= 40.6.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "classic-criteria"
version = "0.2.1"
authors = [
    {name = "Sergey Variasov", email = "variasov@gmail.com"},
]
description = "Provides basic DDD primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/variasov/classic-criteria"

[tool.setuptools.packages.find]
where = ["sources"]
namespaces = true

[tool.setuptools.package-data]
"classic.criteria" = ["py.typed"]

[dependency-groups]
dev = [
    "pytest~=9.2.0",
]
