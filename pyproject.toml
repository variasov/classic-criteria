[build-system]
requires = [
    "setuptools >= 40.6.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "classic-domain"
version = "0.2.0"
authors = [
    {name = "Sergey Variasov", email = "variasov@gmail.com"},
]
description = "Provides basic DDD primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/variasov/classic-domain"

[project.optional-dependencies]
db-tools = [
    "classic-db-tools~=1.0",
    "Jinja2~=3.1",
]

[tool.setuptools.packages.find]
where = ["sources"]
namespaces = true

[dependency-groups]
dev = [
    "pytest~=9.0",
    "psycopg>=3.3.3",
    "mypy>=1.19.1",
]
